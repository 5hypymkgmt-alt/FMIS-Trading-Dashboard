name: Update FMIS Economic Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.FMIS_PAGES_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update economic calendar
        env:
          FINANCECALENDAR_API_KEY: ${{ secrets.FINANCECALENDAR_API_KEY }}
        run: python update_calendar.py

      - name: Validate calendar JSON
        run: python -m json.tool calendar-data.json > /dev/null

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FMIS economic calendar"
            git push origin HEAD:main
          fi
