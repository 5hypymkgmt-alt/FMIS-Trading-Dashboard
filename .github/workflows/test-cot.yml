
name: Test COT Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: python -m pip install requests

      - name: Test Gold COT data
        run: python cot_data.py
