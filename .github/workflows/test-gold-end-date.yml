name: Test FMIS Gold History - Phase 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-end-date:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate diagnostic syntax
        run: python -m py_compile diagnostics/test_gold_history.py

      - name: Test Gold candle end date
        env:
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
        run: python diagnostics/test_gold_history.py
