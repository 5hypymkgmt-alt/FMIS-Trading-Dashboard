name: Test Underlying Market Prices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Diagnose native weekly Gold candles
        env:
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
        run: python tests/test_gold_weekly_api.py
