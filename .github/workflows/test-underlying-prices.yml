name: Test Underlying Market Prices

on:
  workflow_dispatch:
  push:
    branches:
      - fmis-underlying-price-feeds

permissions:
  contents: read

jobs:
  test-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Twelve Data underlying prices
        env:
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
        run: python tests/test_underlying_prices.py
