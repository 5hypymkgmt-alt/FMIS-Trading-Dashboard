
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>FMIS Economic Calendar Test</title>
  <style>
    body {
      background: #090f1b;
      color: #eaf1fc;
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    .panel {
      background: #151f30;
      border: 1px solid #29384c;
      border-radius: 12px;
      padding: 24px;
      max-width: 700px;
      margin: auto;
    }
    h1 { color: #72a9ff; }
    h2 { font-size: 19px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid #29384c;
    }
    .row strong { color: #ffbf69; }
    .note { color: #9daec4; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>FMIS Market Intelligence</h1>
    <p class="note">Economic Calendar — Test Mode</p>
    <div id="economic-calendar"></div>
    <p class="note">
      Demonstration events only. Not live economic data.
    </p>
  </main>

  <script src="./economic-calendar.js"></script>
  <script>
    if (window.FMISCalendar) {
      const now = Date.now();

      window.FMISCalendar.setEvents([
        {
          name: "US CPI — Test Event",
          impact: "High",
          date: new Date(
            now + 24 * 60 * 60 * 1000
          ).toISOString()
        },
        {
          name: "Federal Reserve — Test Event",
          impact: "High",
          date: new Date(
            now + 48 * 60 * 60 * 1000
          ).toISOString()
        },
        {
          name: "UK Interest Rate — Test Event",
          impact: "High",
          date: new Date(
            now + 72 * 60 * 60 * 1000
          ).toISOString()
        }
      ]);

      window.FMISCalendar.render("economic-calendar");
    } else {
      document.getElementById("economic-calendar")
        .textContent = "Calendar module failed to load.";
    }
  </script>
</body>
</html>
